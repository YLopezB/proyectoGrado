# Servidor estático del frontend (SPA). El gateway le reenvía todo lo que no sea /api ni /socket.io
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca en caché (para que los despliegues nuevos se vean de inmediato)
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Rutas de React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
