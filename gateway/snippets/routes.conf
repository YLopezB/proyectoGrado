# Rutas del API Gateway (compartidas por dev y prod).
# Los destinos se resuelven por DNS de Docker en cada petición (variables + resolver),
# así nginx arranca aunque un servicio aún no exista y no cachea IPs viejas al reiniciar contenedores.

set $svc_auth       http://auth-service:4001;
set $svc_users      http://user-service:4002;
set $svc_tasks      http://task-service:4003;
set $svc_repository http://repository-service:4004;
set $svc_chat       http://chat-service:4005;
set $svc_org        http://org-service:4006;
set $svc_posts      http://post-service:4007;

# Estado del gateway
location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Los endpoints /internal de los microservicios nunca se exponen
location ^~ /internal/ { return 404; }

# ---------- Autenticación ----------
location = /api/auth/login {
    limit_req zone=login burst=30 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_auth;
}
location /api/auth/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_auth;
}

# ---------- Usuarios ----------
location /api/users {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_users;
}

# ---------- Empresa, áreas y cargos (org-service) ----------
location /api/company {
    client_max_body_size 25m;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_org;
}
location /api/areas {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_org;
}
location /api/positions {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_org;
}

# ---------- Publicaciones ----------
location /api/posts {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_posts;
}

# ---------- Tareas ----------
location /api/tasks {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_tasks;
}

# ---------- Repositorio de archivos (subidas grandes en streaming) ----------
location /api/files {
    client_max_body_size 1100m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_repository;
}

# ---------- Chat: API REST + WebSocket (Socket.IO) ----------
location /api/chat {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $svc_chat;
}
location /socket.io/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_pass $svc_chat;
}

# Cualquier otra ruta /api/* inexistente
location ^~ /api/ {
    default_type application/json;
    return 404 '{"error":"Ruta no encontrada"}';
}

# ---------- Frontend (SPA React) ----------
location / {
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;       # HMR de Vite en desarrollo
    proxy_set_header Connection $connection_upgrade;
    proxy_pass $svc_frontend;
}
