resolver 127.0.0.11 valid=10s ipv6=off;   # DNS interno de Docker

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# Respeta X-Forwarded-Proto si hay otro proxy/balanceador delante (p. ej. Cloudflare)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Protección básica contra inundación en el login (el límite por intentos fallidos lo aplica auth-service)
limit_req_zone $binary_remote_addr zone=login:10m rate=120r/m;

server_tokens off;
sendfile on;
keepalive_timeout 65;
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
gzip_min_length 1024;

log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" rt=$request_time';
access_log /var/log/nginx/access.log main;
error_log  /var/log/nginx/error.log warn;

# Valores por defecto del proxy (los locations pueden sobrescribirlos)
proxy_http_version 1.1;
proxy_connect_timeout 10s;
proxy_read_timeout 120s;
