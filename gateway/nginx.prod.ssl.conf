# API Gateway - PRODUCCIÓN con HTTPS.
# Requiere ./certs/fullchain.pem y ./certs/privkey.pem  (ver README, sección HTTPS).
worker_processes auto;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /etc/nginx/snippets/http-common.conf;

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        location = /gateway-health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/snippets/security-headers.conf;
        set $svc_frontend http://frontend:80;
        include /etc/nginx/snippets/routes.conf;
    }
}
